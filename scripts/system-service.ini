[Unit]
# A short, human-readable name for the service used in systemctl logs and status.
Description=Nexus Repository Service
# Ensures Nexus only attempts to start after the network stack is fully up.
After=network.target

[Service]
# Tells systemd the process will "fork" into the background (standard for the Nexus startup script).
Type=forking
# Increases the maximum number of open files to 65536; Nexus requires this for its database and repositories.
LimitNOFILE=65536
# The exact command used to start the Nexus application.
ExecStart=/opt/nexus/bin/nexus start
# The exact command used to gracefully shut down the Nexus application.
ExecStop=/opt/nexus/bin/nexus stop

# The restricted system user that will own the running process for security.
User=nexus
# Sets the initial directory for the process; useful for storing Java-related caches or profile data.
WorkingDirectory=/var/lib/nexus
# Automatically restarts the service if the Nexus process crashes or exits unexpectedly.
Restart=on-abort
# Allows up to 10 minutes for startup; Nexus is a heavy Java app and can take time to initialize.
TimeoutSec=600

[Install]
# Defines that this service should start automatically when the system boots into its normal state.
WantedBy=multi-user.target
